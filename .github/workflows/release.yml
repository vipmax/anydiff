name: Release AnyDiff

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show Xcode & Swift version
        run: |
          xcode-select -p
          swift --version

      - name: Run Test Suite
        run: swift test

      - name: Package AnyDiff.app & DMG
        run: |
          chmod +x ./scripts/package_app.sh
          ./scripts/package_app.sh all

      - name: Determine Tag
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.get_tag.outputs.tag }}"
          RELEASE_FILES=(
            dist/AnyDiff-macOS-arm64.dmg
            dist/AnyDiff-macOS-arm64.zip
            dist/AnyDiff-macOS-x86_64.dmg
            dist/AnyDiff-macOS-x86_64.zip
            dist/AnyDiff.dmg
            dist/AnyDiff-macOS.zip
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            EXISTING_ASSETS=$(gh release view "$TAG" --json assets -q '.assets.[].name' 2>/dev/null || true)
            if echo "$EXISTING_ASSETS" | grep -q "AnyDiff-macOS-arm64.zip"; then
              echo "Release assets already exist for $TAG. Skipping upload to protect Homebrew checksum integrity."
            else
              echo "Uploading assets to existing release $TAG..."
              gh release upload "$TAG" "${RELEASE_FILES[@]}"
            fi
          else
            gh release create "$TAG" \
              --title "AnyDiff $TAG" \
              --generate-notes \
              "${RELEASE_FILES[@]}"
          fi

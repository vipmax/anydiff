name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show Xcode & Swift version
        run: |
          xcode-select -p
          swift --version

      - name: Run Test Suite
        run: swift test

      - name: Build Release App
        run: |
          chmod +x ./scripts/package_app.sh
          ./scripts/package_app.sh
